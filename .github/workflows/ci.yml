name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: ASCII in descriptions
        run: scripts/check-ascii.sh

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning

      - name: shellcheck
        run: shellcheck scripts/*.sh

  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The automation runs the script on python3.11 in SSM.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: unit tests
        run: python3 -I tests/test_spend_limit.py -v

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: ["6.0.0", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Pins the provider to the lowest version the module supports. The latest leg
      # leaves the constraint alone. The grep fails the job if the sed matched nothing.
      - name: pin the provider
        if: matrix.provider != 'latest'
        run: |
          sed -i 's/version = ">= 6.0"/version = "= ${{ matrix.provider }}"/' versions.tf
          grep -q 'version = "= ${{ matrix.provider }}"' versions.tf

      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform test
        run: terraform test
